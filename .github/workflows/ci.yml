name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate installer
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq nftables shellcheck

      - name: Check Bash syntax
        run: bash -n src/*.sh scripts/build-standalone.sh install-sing-box-server.sh tests/*.sh

      - name: Run ShellCheck
        run: shellcheck --severity=style scripts/build-standalone.sh install-sing-box-server.sh tests/*.sh

      - name: Check generated standalone installer
        run: scripts/build-standalone.sh && git diff --exit-code -- install-sing-box-server.sh

      - name: Run static smoke tests
        run: bash tests/static-smoke.sh

      - name: Run state smoke tests
        run: bash tests/fingerprint-smoke.sh

      - name: Run health smoke tests
        run: bash tests/health-smoke.sh

      - name: Run management lifecycle smoke tests
        run: bash tests/management-lifecycle-smoke.sh

      - name: Run package policy smoke tests
        run: bash tests/package-policy-smoke.sh

      - name: Validate dry-run plan
        run: ./install-sing-box-server.sh plan

      - name: Validate nftables candidate
        run: sudo bash tests/firewall-smoke.sh
