name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate installer
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq nftables openssh-server shellcheck

      - name: Check Bash syntax
        run: bash -n src/*.sh scripts/build-standalone.sh install-sing-box-server.sh tests/*.sh

      - name: Run ShellCheck
        run: shellcheck --severity=style scripts/build-standalone.sh install-sing-box-server.sh tests/*.sh

      - name: Check generated standalone installer
        run: scripts/build-standalone.sh && git diff --exit-code -- install-sing-box-server.sh

      - name: Run static smoke tests
        run: bash tests/static-smoke.sh

      - name: Run state smoke tests
        run: bash tests/fingerprint-smoke.sh

      - name: Run health smoke tests
        run: bash tests/health-smoke.sh

      - name: Run management lifecycle smoke tests
        run: bash tests/management-lifecycle-smoke.sh

      - name: Run package policy smoke tests
        run: bash tests/package-policy-smoke.sh

      - name: Run self-update smoke tests
        run: bash tests/self-update-smoke.sh

      - name: Run deferred overlay regression
        run: bash tests/deferred-overlay-smoke.sh

      - name: Run same-version reconciliation regression
        run: bash tests/same-version-reconciliation-smoke.sh

      - name: Validate detached self-update lifecycle
        run: sudo bash tests/self-update-systemd-smoke.sh

      - name: Validate deferred SSH transport lifecycle
        run: sudo bash tests/deferred-ssh-systemd-smoke.sh

      - name: Validate certificate watcher lifecycle
        run: sudo bash tests/certificate-lifecycle-smoke.sh

      - name: Validate dry-run plan
        run: ./install-sing-box-server.sh plan

      - name: Validate nftables candidate
        run: sudo bash tests/firewall-smoke.sh
